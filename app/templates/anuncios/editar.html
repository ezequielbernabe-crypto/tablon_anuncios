{% extends "base.html" %}

{% block title %}Editar anuncio{% endblock %}

{% block content %}

<h2>Editar anuncio</h2>

<form method="POST">

    <label>Título:</label>
    <input type="text" name="titulo" value="{{ anuncio.titulo }}" required>

    <br><br>

    <label>Descripción:</label>
    <textarea name="descripcion" required>{{ anuncio.descripcion }}</textarea>

    <br><br>

    <label>Categoría:</label>
    <select name="categoria_id" required>
        {% for categoria in categorias %}
            <option value="{{ categoria.id }}"
                {% if categoria.id == anuncio.categoria_id %}selected{% endif %}>
                {{ categoria.nombre }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">Guardar cambios</button>

</form>

{% endblock %}
